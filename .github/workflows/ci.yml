name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      # docs/, llms*.txt and the AGENTS.md index are generated from JSDoc;
      # fail when a component changed without `pnpm run docs`.
      - run: pnpm run docs && git diff --exit-code -- docs AGENTS.md llms.txt llms-full.txt
      - run: pnpm test
      - run: pnpm run build
      # Catches a broken exports map before it reaches a project.
      - run: pnpm run check-exports
