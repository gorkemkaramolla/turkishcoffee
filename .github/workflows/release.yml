name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # A missing or mistyped secret otherwise surfaces much later as an
      # ENEEDAUTH from inside the publish step.
      - name: Check npm credentials
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty or not set on this repository."
            exit 1
          fi
          echo "NPM_TOKEN is set (${#NPM_TOKEN} characters)."
          # Reported as annotations, not plain output: the step log is only
          # readable with admin rights, while annotations are not. Never fatal,
          # since a token scoped to one package can fail whoami and still
          # publish -- the publish step is the judge.
          echo "::warning::whoami: $(npm whoami 2>&1 | tail -1)"
          echo "::warning::access: $(npm access list packages 2>&1 | tr '\n' ' ' | cut -c1-400)"

      # Opens a "Version Packages" PR when changesets are pending; publishes to
      # npm when that PR is merged.
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # changesets/action writes its own .npmrc and reads NPM_TOKEN;
          # NODE_AUTH_TOKEN is what the npmrc from setup-node expands.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
